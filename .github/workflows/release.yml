name: Build Signed APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [official, beta, dev, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare PKCS12 signing
        env:
          RELEASE_KEY_STORE_B64: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY_STORE_B64" || { echo "Missing RELEASE_KEY_STORE secret"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }

          printf '%s' "$RELEASE_KEY_STORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/app/release-ci.p12"
          {
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/app/release-ci.p12"
            echo "RELEASE_STORE_TYPE=pkcs12"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build signed APK
        env:
          FLAVOR: ${{ matrix.flavor }}
          VERSION_NAME: 3.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ":app:assemble${FLAVOR^}Release" \
            -PVERSION_NAME="$VERSION_NAME" \
            --no-daemon --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-${{ matrix.flavor }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: legado-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
